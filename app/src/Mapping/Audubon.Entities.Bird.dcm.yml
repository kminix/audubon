Audubon\Entities\Bird:
    type: entity
    table: bird_sightings
    id:
        id:
            type: integer
            nullable: false
            options:
                unsigned: false
            id: true
            generator:
                strategy: IDENTITY
    fields:
        name:
            type: string
            nullable: true
            length: 50
        email:
            type: string
            nullable: true
            length: 50
        phone:
            type: string
            nullable: true
            length: 30
        location:
            type: string
            nullable: false
            length: 50
        sighted_at:
            type: datetime
            nullable: false

        species:
            type: string
            nullable: false
            length: 50
        description:
            type: text
            nullable: false
    lifecycleCallbacks: {  }